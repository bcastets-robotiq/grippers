name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libserialport (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev

      - name: Install libserialport (macOS)
        if: runner.os == 'macOS'
        run: brew install libserialport

      # libserialport has no vcpkg port; MSYS2 packages it (UCRT64).
      - name: Set up MSYS2 with libserialport (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          pacboy: toolchain:p cmake:p ninja:p pkgconf:p libserialport:p

      - name: Configure, build, test
        if: runner.os != 'Windows'
        run: |
          cmake -S sdk_cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

      - name: Configure, build, test (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S sdk_cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

  # The freestanding configuration has no runner that can run it, so this is a
  # compile-only guard. It exists because the bare-metal breakages are the quiet
  # kind: the standard library's threading probe answering wrongly downgrades
  # detail::Mutex to a no-op lock rather than failing the build.
  embedded:
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -std=c++17 -Isdk_cpp/include -Isdk_cpp/third_party/nanomodbus
                -mcpu=cortex-m55 -mthumb -fexceptions -Wall -Wextra -Werror
                -DGRIPPERS_BUILD_DEFAULT_SERIAL=0
    steps:
      - uses: actions/checkout@v4
      - name: Install the arm-none-eabi toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      # The single-threaded layer: what a superloop target actually builds.
      - name: Compile for cortex-m55
        run: |
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/logger.cpp
          arm-none-eabi-g++ $CXXFLAGS -c -o /dev/null sdk_cpp/src/detail/gripper_modbus_client.cpp

      - name: Assert the target is detected as thread-less
        run: |
          printf '#include <Robotiq/detail/std_threading.hpp>\n' > probe.cpp
          printf 'static_assert(GRIPPERS_HAS_STD_THREADS == 0, "cortex-m55 has no gthreads");\n' >> probe.cpp
          arm-none-eabi-g++ $CXXFLAGS -fsyntax-only probe.cpp

      # Gripper needs a thread: without an RTOS adapter that must be a loud
      # #error, never a silent build against a no-op lock.
      - name: Assert the threaded Gripper refuses to build without an RTOS
        run: |
          if arm-none-eabi-g++ $CXXFLAGS -fsyntax-only sdk_cpp/src/gripper.cpp 2> err.log; then
            echo "::error::gripper.cpp compiled for a thread-less target; it must #error instead"
            exit 1
          fi
          grep -q "GRIPPERS_RTOS_THREADX" err.log || { echo "::error::failed, but not with the documented diagnostic"; cat err.log; exit 1; }

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          git ls-files 'sdk_cpp/include/**/*.hpp' 'sdk_cpp/src/**/*.[ch]pp' 'sdk_cpp/tests/**/*.[ch]pp' 'sdk_cpp/examples/**/*.cpp' \
            | xargs clang-format --dry-run --Werror

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev gcovr
      - name: Configure
        run: >
          cmake -S sdk_cpp -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage
          -DGRIPPERS_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: >
          gcovr --root . --filter 'sdk_cpp/(include|src)/' build
          --print-summary --xml coverage.xml --html-details coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.html
